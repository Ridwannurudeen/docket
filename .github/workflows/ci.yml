name: ci
on:
  push:
    # The work happens on the deliberation branch, not on main. Filtering to main alone
    # meant CI had nothing to say about any commit that has landed since Stage 4 — the
    # package job below exists to catch a defect that has now shipped three times, and it
    # was watching a branch nobody was pushing to.
    branches: [main, "docs/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/build-requirements.txt'
      - run: uv sync --locked --extra dev --no-build --no-install-project --python "$pythonLocation/bin/python"
      - run: .venv/bin/python -m pytest -q

  # The browser half of the suite. The activation surfaces are shells whose whole behaviour
  # is JavaScript — the wallet conversation, the x402 envelope, the failure recovery — and
  # pytest can only assert that the shells are served. This job drives them in a real
  # browser against a real uvicorn, with the wallet and the not-yet-merged lanes' APIs
  # faked at the network boundary. Playwright is a test-time dependency only: nothing under
  # `docket/` imports it and no page loads anything from npm.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/build-requirements.txt'
      # The same environment the `test` job builds, because the fixture starts uvicorn out
      # of it. `DOCKET_PYTHON` then points Playwright at that interpreter rather than at the
      # `.venv/Scripts/python.exe` a Windows checkout would have.
      - run: uv sync --locked --extra dev --no-build --no-install-project --python "$pythonLocation/bin/python"
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
        env:
          DOCKET_PYTHON: ${{ github.workspace }}/.venv/bin/python

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r deploy/build-requirements.txt'
      - name: Verify the exported runtime lock is current
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements.txt \
            --output-file deploy/runtime-requirements.txt
          git diff --exit-code -- deploy/runtime-requirements.txt
      - name: Build the clean-HEAD provenance bundle
        run: python deploy/release_bundle.py build "$RUNNER_TEMP/release-bundle"
      - run: python -m venv "$RUNNER_TEMP/docket-venv"
      # Block scalars, because a value that begins with a quote ends at its closing quote:
      # `run: "$X/python" -m pip ...` is not a long command, it is a YAML syntax error with
      # a command after it. That mistake failed every run at zero seconds, which reads as
      # infrastructure trouble rather than as a file this repository controls.
      - name: Install the built wheel into a venv outside the checkout
        run: |
          "$RUNNER_TEMP/docket-venv/bin/python" -m pip install --require-hashes \
            --only-binary=:all: \
            -r "$RUNNER_TEMP/release-bundle/deploy/runtime-requirements.txt"
          "$RUNNER_TEMP/docket-venv/bin/python" -m pip install --no-deps \
            "$RUNNER_TEMP"/release-bundle/docket-*.whl
          "$RUNNER_TEMP/docket-venv/bin/python" -m pip check
      # -I so the source tree cannot shadow the installed package: without it this tests the
      # checkout and reports it as having tested the wheel.
      - name: Smoke-test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/docket-venv/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke_installed.py"
