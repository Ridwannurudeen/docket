name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.5.0
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - run: python -m venv "$RUNNER_TEMP/docket-venv"
      - run: "$RUNNER_TEMP/docket-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/docket-*.whl
      - name: Smoke-test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/docket-venv/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke_installed.py"
