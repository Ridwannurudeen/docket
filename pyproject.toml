[project]
name = "docket"
version = "0.1.0"
description = "Docket — trust-first agent marketplace for BSC (Build the Era)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "web3==7.16.0",
    "eth-account==0.13.7",
    "eth-abi<6",
    "httpx==0.28.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "docket",
    "docket.advantage",
    "docket.advantage.v2",
    "docket.advantage.v3",
    "docket.api",
    "docket.agents",
    "docket.agents.grid",
    "docket.agents.pancake",
    "docket.agents.venus",
    "docket.agents.yield_router",
    "docket.escrow",
    "docket.execution",
    "docket.hire",
    "docket.marketplace",
    "experiments",
]

[tool.setuptools.package-data]
"docket.api" = ["static/*", "web/*"]
# /advantage.json is served from these files, so an installed Docket must carry them.
# The v2 files are the evidence a report cites — the labelled corpus, the pre-registration
# that hashes it, and the run recorded against that hash — and an install that shipped the
# scorer without them would carry the arithmetic and none of the observations.
"docket.advantage" = [
    "experiments/*.json",
    "v2/corpus/*/*.json",
    "v2/specs/*.json",
    "v2/runs/*.json",
    # v3 registrations are the evidence that a question predates its answers, so an install
    # that shipped the harness without them would carry the procedure and none of the proof.
    "v3/specs/*.json",
    "v3/inputs/*.json",
    "v3/runs/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
