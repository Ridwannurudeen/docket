[project]
name = "docket"
version = "0.1.0"
description = "Docket — trust-first agent marketplace for BSC (Build the Era)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "web3==7.16.0",
    "eth-account==0.13.7",
    "eth-abi<6",
    "httpx==0.28.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "pip-audit==2.10.1",
    "pytest==9.0.3",
    "pyyaml==6.0.2",
    "ruff==0.16.5",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "docket",
    "docket.advantage",
    "docket.advantage.v2",
    "docket.advantage.v3",
    "docket.advantage.v3.seats",
    "docket.api",
    "docket.agents",
    "docket.agents.grid",
    "docket.agents.pancake",
    "docket.agents.venus",
    "docket.agents.yield_router",
    "docket.escrow",
    "docket.execution",
    "docket.hire",
    "docket.identity",
    "docket.jobs",
    "docket.jobs.executors",
    "docket.marketplace",
    "docket.sessions",
    "experiments",
]

[tool.setuptools.package-data]
"docket.api" = [
    "static/*",
    "static/agents/*.registration.json",
    "web/*",
    # `web/*` does not descend, so the browser modules need their own globs. A wheel
    # built without them serves the activation pages with every script 404ing.
    "web/js/*",
    "web/js/pages/*",
]
# The committed marketplace census. An installed Docket that shipped the marketplace code
# without it would start with an empty shelf and no way to refill it offline.
"docket.marketplace" = ["seed/*.json"]
# /advantage.json is served from these files, so an installed Docket must carry them.
# The v2 files are the evidence a report cites — the labelled corpus, the pre-registration
# that hashes it, and the run recorded against that hash — and an install that shipped the
# scorer without them would carry the arithmetic and none of the observations.
"docket.advantage" = [
    "experiments/*.json",
    "experiments/*/*.json",
    "recorded_runs/*.json",
    "v2/corpus/*/*.json",
    "v2/specs/*.json",
    "v2/runs/*.json",
    # v3 registrations and artifacts let an installed report reconstruct the same state as
    # the checkout instead of silently dropping a ledger or a prompt-blinded score sheet.
    "v3/specs/*.json",
    "v3/inputs/*.json",
    "v3/runs/*.jsonl",
    "v3/sheets/*/*.json",
    "v3/mappings/*.json",
    # The frozen vendor vocabulary an input lock validates labels against, and the page it
    # was read from. Shipping the derived list without the page would leave an installed
    # Docket asserting a vocabulary with no evidence of where it came from.
    "v3/sources/*.json",
    "v3/sources/*.html",
    "v3/provenance/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `.venv` and `build` are in ruff's own defaults; they are named again because a release
# builds both inside the checkout. `docket-w*` and `.claude` are the sibling worktrees this
# repository is developed in — linting them would report another branch's code as this one's.
extend-exclude = ["build", ".venv", "docket-w*", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The long lines in this module are shell fixtures embedded as Python strings: fake `curl`
# bodies that the release script parses byte for byte. A `# noqa` cannot be placed inside a
# string literal, and wrapping the line would change the script under test rather than the
# test's formatting.
"tests/test_release_scripts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
