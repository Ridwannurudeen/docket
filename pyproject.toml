[project]
name = "docket"
version = "0.1.0"
description = "Docket — trust-first agent marketplace for BSC (Build the Era)"
requires-python = ">=3.11"
dependencies = [
    "web3==7.16.0",
    "eth-account==0.13.7",
    "eth-abi<6",
    "httpx==0.28.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "docket",
    "docket.advantage",
    "docket.advantage.v2",
    "docket.api",
    "docket.agents",
    "docket.agents.grid",
    "docket.agents.pancake",
    "docket.escrow",
    "docket.execution",
    "docket.hire",
    "docket.marketplace",
    "experiments",
]

[tool.setuptools.package-data]
"docket.api" = ["static/*", "web/*"]
# /advantage.json is served from these files, so an installed Docket must carry them.
"docket.advantage" = ["experiments/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
